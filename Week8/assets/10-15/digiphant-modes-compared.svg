ce</text><text x="252" y="475" text-anchor="middle" fill="#5d5862" font-size="11" font-family="IBM Plex Sans">savannah course · chase camera follows the elephant</text><text x="40" y="512" fill="#5d5862" font-size="11" letter-spacing="1.1" font-family="IBM Plex Mono">RUNS ON</text><rect x="40" y="520" width="424" height="52" rx="6" fill="#ffffff" stroke="#b9b4bd" stroke-width="1.3" stroke-dasharray="5 4"/><text x="252" y="543" text-anchor="middle" fill="#17141a" font-size="13" font-weight="600" font-family="IBM Plex Sans">bridge.py · TeamDeadweight.unity</text><text x="252" y="559" text-anchor="middle" fill="#5d5862" font-size="11" font-family="IBM Plex Sans">gesture and phone detection on</text><text x="40" y="608" fill="#17141a" font-size="13" font-weight="600" font-family="IBM Plex Sans">If one person leaves the camera,</text><text x="40" y="626" fill="#17141a" font-size="13" font-weight="600" font-family="IBM Plex Sans">the whole elephant waits for them.</text><text x="536" y="44" fill="#17141a" font-size="15" font-weight="600" font-family="IBM Plex Sans">Tank Battle · 1 person, 1 elephant each</text><text x="536" y="62" fill="#5d5862" font-size="11" font-family="IBM Plex Sans">Competitive game: everyone drives their own body</text><rect x="536" y="84" width="424" height="52" rx="6" fill="#ffffff" stroke="#b9b4bd" stroke-width="1.3"/><text x="748" y="107" text-anchor="middle" fill="#17141a" font-size="13" font-weight="600" font-family="IBM Plex Sans">Camera split into 3 lanes</text><text x="748" y="123" text-anchor="middle" fill="#5d5862" font-size="11" font-family="IBM Plex Sans">the lane you sit in is your player number</text><line x1="748" y1="136" x2="748" y2="156" fill="none" stroke="#17141a" stroke-width="1.3"/><rect x="536" y="158" width="424" height="60" rx="6" fill="#ffffff" stroke="#b9b4bd" stroke-width="1.3"/><text x="748" y="185" text-anchor="middle" fill="#17141a" font-size="13" font-weight="600" font-family="IBM Plex Sans">Each lane tracked on its 